name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: build package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          number=${TAG#v}
          case "$number" in
            ''|*[!0-9]*) echo "tag $TAG is not v<number>"; exit 1 ;;
          esac
          mkdir -p dist/pkg
          cp -R bin install.ps1 install.sh install-hook.ps1 LICENSE dist/pkg/
          echo "$(git log -1 --format='%H %ct') $number" > dist/pkg/clm.version
          (cd dist/pkg && zip -r -X "../clm-$TAG.zip" .)
          (cd dist && sha256sum "clm-$TAG.zip" > "clm-$TAG.zip.sha256")
          cat "dist/clm-$TAG.zip.sha256"

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "dist/clm-$TAG.zip" "dist/clm-$TAG.zip.sha256" --title "clm $TAG" --generate-notes --verify-tag
